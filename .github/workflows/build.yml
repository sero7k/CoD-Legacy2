name: Build CodLegacy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Generate the Visual Studio solution
        run: tools\premake5.exe vs2022

      - name: Build (Release x64)
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 build\hmw-mod.sln

      - uses: actions/upload-artifact@v4
        with:
          name: CodLegacy
          path: build\bin\x64\Release\CodLegacy.exe
          if-no-files-found: error
